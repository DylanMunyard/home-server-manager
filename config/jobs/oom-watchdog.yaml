name: OOM watchdog
description: >
  Page the moment the kernel OOM-kills anything, naming the victim, its RSS, the
  pod that owned it, and — the actionable part — whether the kill was contained
  to a cgroup or went node-wide because the container had no memory limit.
schedule: "*/2 * * * *"          # edge-triggered + watermarked, so the cadence
                                 # only sets latency; no event is ever missed
target: hetzner/bfstats

run: oom-check                   # reports kills SINCE THE LAST RUN, so it fires
                                 # on the first one instead of waiting for a
                                 # threshold to stay bad. Complements
                                 # bfstats-watchdog, which watches the ramp-up:
                                 # this one watches the wreckage.

# Deliberately NO `then:` chain. Attaching a profiler here is both expensive and
# useless: dotnet-hot-threads downloads a ~100MB tool, copies it into the target
# container and attaches via nsenter — piling load onto a node that has just
# been OOM-killed — and by the time it runs the victim has RESTARTED, so its
# stacks show process startup rather than whatever did the allocating. The check
# already carries everything actionable (global vs cgroup-scoped, victim, RSS,
# owning pod). Digging deeper is an on-demand act, which is what `investigate:`
# below and a manual dotnet-hot-threads run are for.
#
# And therefore NO `when:` either — that pairing is load-bearing, not an
# omission. Per jobs.runner.ts, `action` only fires when a `then` chain runs,
# and a failing check only counts as an `error` when the job has NO `when`
# (a check WITH a `when` is treated as a trigger signal, not a failure). A
# `when` with no `then` would therefore detect every OOM and alert on none of
# them. With neither, the check IS the work: its nonzero exit is the alert.

params:
  OOM_LOOKBACK_MINS: "15"        # only bounds the FIRST run after a reboot

notify:
  on: [error]                    # with no `then` chain there is no `action`
                                 # event; the check's nonzero exit IS the alert
  priority: max                  # a global OOM can take the node down; this is
                                 # the one alert worth waking up for

investigate: >
  The kernel OOM-killed a process. Establish first whether it was a GLOBAL kill
  (constraint=CONSTRAINT_NONE / global_oom — the container had no memory limit,
  so the victim was chosen from the entire node and unrelated pods took
  collateral damage) or a cgroup-scoped one (contained, working as intended).
  For a global kill, name the unbounded container and the pod that owned the
  victim. Then attribute the growth: correlate against recent deploys, and check
  whether it is allocation churn, an unbounded work queue, or query volume
  against SQLite. The August 2026 incident is the known prior — an uncapped
  bf42-stats API container leaked under a gamification batch loop and crashed the
  node twelve times before anyone noticed, because kubelet recorded every kill as
  exitCode 255 / reason "Unknown" rather than OOMKilled.
