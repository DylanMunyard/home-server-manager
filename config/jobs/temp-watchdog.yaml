name: Temp watchdog
description: Alert when any bare-metal host runs hot for 5+ minutes
schedule: "*/2 * * * *"          # MUST be shorter than TEMP_SUSTAIN (300s)

# `target` takes a list — one job fans out across every host each tick, with an
# independent check + debounce + alert per host. The temp-check runbook reads
# sysfs and no-ops on targets with no sensors (LXC/VM), so it's safe to add any
# host here.
target:
  - bethany/proxmox              # x86 hypervisor
  - pi-town/master               # k3s nodes (ARM, throttle ~80°C)
  - pi-town/level-1
  - pi-town/level-2

run: temp-check                  # monitor-only: nonzero check (= ran hot) alerts

params:
  TEMP_THRESHOLD: "80"           # job-wide; one line for all hosts. Split into
                                 # separate jobs if a host needs its own number.

notify:
  on: [error]
  priority: high

# When a host runs hot, kick off an AI investigation of that box — an agentic
# loop of read-only SSH probes. `investigate:` can be `true`, or (as here) a
# free-text intent that steers the probe loop. No-op if Azure OpenAI isn't
# configured. See api/src/ai/ai.investigate.ts.
investigate: >
  Correlate the sustained high temperature with what was actually running on the
  box at the time — identify the process(es) or workload (e.g. a transcode,
  build, backup, or runaway process) driving CPU and thermals, and whether the
  CPU was thermally throttling.
