---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-server-mgr-api
  namespace: home-server-mgr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-server-mgr-api
  template:
    metadata:
      labels:
        app: home-server-mgr-api
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: api
          image: dylanmunyard/home-server-manager:api
          imagePullPolicy: Always
          ports:
            - containerPort: 5781
          env:
            - name: PORT
              value: "5781"
            - name: HOME
              value: "/home/app"
            # Public URL the app is reached at — used to build the OAuth
            # callback URI and (because the image bakes NODE_ENV=production) to
            # set Secure cookies. Not a secret, so it lives here. Set to your
            # real domain.
            - name: PUBLIC_URL
              value: "https://mgr.munyard.dev"
          # envFrom pulls every key in home-server-mgr-secrets in as an env
          # var. Add a new ${VAR} to config/servers/*.yaml? Just add the same
          # key to the Secret — no Deployment edit needed. The Discord OAuth +
          # session secrets (DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET,
          # ALLOWED_DISCORD_IDS, SESSION_SECRET, SESSION_SALT) ride in the same
          # way. optional=true so the pod still starts if no secret-backed vars
          # are needed yet.
          envFrom:
            - secretRef:
                name: home-server-mgr-secrets
                optional: true
          # The compiled config loader resolves the config dir relative to its
          # own location: dist/config.js → ../../config → /config (the runtime
          # image has dist at /app/dist, not api/dist, so it overshoots to the
          # filesystem root). Mount the ConfigMaps there to match.
          volumeMounts:
            - name: servers-config
              mountPath: /config/servers
              readOnly: true
            - name: scripts-config
              mountPath: /config/scripts
              readOnly: true
            - name: ssh-keys
              mountPath: /home/app/.ssh
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            # Steady-state RSS is ~40Mi, but the node:20-slim (glibc) image has
            # a ~300Mi transient memory spike at startup (faulting in the Node
            # runtime + module graph) that musl/alpine didn't have. A 256Mi
            # limit OOM-kills the container mid-startup (exit 137, before it can
            # even log) — verified by reproducing the OOM locally under a hard
            # cap. 512Mi gives comfortable headroom over the spike.
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: servers-config
          configMap:
            name: home-server-mgr-servers
        - name: scripts-config
          configMap:
            name: home-server-mgr-scripts
            defaultMode: 0755
        - name: ssh-keys
          secret:
            secretName: home-server-mgr-ssh
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: home-server-mgr-api
  namespace: home-server-mgr
  labels:
    app: home-server-mgr-api
spec:
  selector:
    app: home-server-mgr-api
  type: ClusterIP
  ports:
    - port: 5781
      targetPort: 5781
      name: api
