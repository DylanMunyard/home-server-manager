# Namespace + ServiceAccount + Role + RoleBinding for in-cluster Jenkins
# deployment auth.
#
# Apply with:
#   kubectl apply -f deploy/k8s/rbac.yaml
#
# The Jenkins agent pod runs in this namespace (see Jenkinsfile agent block)
# under the home-server-mgr-deployer ServiceAccount. kubectl in the pod uses
# the auto-mounted token — no external kubeconfig credential needed.
---
apiVersion: v1
kind: Namespace
metadata:
  name: home-server-mgr
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-server-mgr-deployer
  namespace: home-server-mgr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-server-mgr-deployer
  namespace: home-server-mgr
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # api-deployment.yaml carries the reports PVC. Without this the pipeline's
  # `kubectl apply -f` is Forbidden on that document while still succeeding on
  # the Deployment and Service — which yields a pod stuck Pending on a volume
  # that was never created, with no failed stage to point at it. No `delete`:
  # nothing in the pipeline should be able to destroy a bound volume.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-server-mgr-deployer
  namespace: home-server-mgr
subjects:
  - kind: ServiceAccount
    name: home-server-mgr-deployer
    namespace: home-server-mgr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-server-mgr-deployer
