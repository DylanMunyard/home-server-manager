# WebSocket upgrade map — required because `Connection: upgrade` must only
# be set when the client actually sent `Upgrade: websocket`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Resolve the API Service name lazily, per-request, via the cluster DNS
    # (kube-dns ClusterIP — the well-known .10 of the service CIDR, stable for
    # the life of the cluster). Combined with the $api_upstream variable in
    # proxy_pass below, this defers resolution to request time so nginx does
    # NOT crash at startup with `host not found in upstream` when the API pod
    # isn't up yet — UI and API deploy in parallel, so the API can lag.
    resolver 10.43.0.10 valid=10s ipv6=off;

    # WebSocket — script output streaming + interactive shell.
    location /ws/ {
        set $api_upstream http://home-server-mgr-api:5781;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        set $api_upstream http://home-server-mgr-api:5781;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}
