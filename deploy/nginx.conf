# WebSocket upgrade map — required because `Connection: upgrade` must only
# be set when the client actually sent `Upgrade: websocket`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream home_server_mgr_api {
    server home-server-mgr-api:5781;
}

server {
    listen 80;
    server_name _;

    # WebSocket — script output streaming + interactive shell.
    location /ws/ {
        proxy_pass http://home_server_mgr_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass http://home_server_mgr_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}
